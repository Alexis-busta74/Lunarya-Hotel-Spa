<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - Modificar Precios</title>
  <link rel="stylesheet" href="../static/css/style.css" />
  <style>
    body {
      font-family: sans-serif;
      margin: 2rem;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }
    form {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px #ccc;
    }
    label {
      display: block;
      margin: 1rem 0 0.5rem;
      font-weight: bold;
    }
    input[type="number"] {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
    }
    button {
      margin-top: 2rem;
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      background-color: #9e8f82;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #7b6e60;
    }
    .success-message {
      color: green;
      text-align: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <h1>Modificar Precios de Habitaciones</h1>

  <form id="precioForm">
    <label for="precio_deluxe">Deluxe Twin (ARS):</label>
    <input type="number" id="precio_deluxe" min="0" required value="80000" />

    <label for="precio_junior">Junior Suite (ARS):</label>
    <input type="number" id="precio_junior" min="0" required value="90000" />

    <label for="precio_executive">Executive Suite (ARS):</label>
    <input type="number" id="precio_executive" min="0" required value="110000" />

    <button type="submit">Guardar Precios</button>
    <p id="msg" class="success-message"></p>
  </form>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    // Obtener precios actuales
    fetch("/api/precios")
      .then(res => res.json())
      .then(data => {
        document.getElementById("precio_deluxe").value = data["Deluxe Twin"];
        document.getElementById("precio_junior").value = data["Junior Suite"];
        document.getElementById("precio_executive").value = data["Executive Suite"];
      })
      .catch(err => console.error("Error al cargar precios:", err));

    // Guardar nuevos precios
    document.getElementById("precioForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const nuevosPrecios = {
        "Deluxe Twin": parseInt(document.getElementById("precio_deluxe").value),
        "Junior Suite": parseInt(document.getElementById("precio_junior").value),
        "Executive Suite": parseInt(document.getElementById("precio_executive").value)
      };

      fetch("/api/precios", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(nuevosPrecios)
      })
        .then(res => res.json())
        .then(data => {
          document.getElementById("msg").textContent = data.mensaje;

          // Redireccionar después de guardar
          setTimeout(() => {
            window.location.href = "/admin_reserva";
          }, 1000); // Espera 1 segundo para mostrar el mensaje antes de redirigir
        })
        .catch(err => {
          console.error("Error al actualizar precios:", err);
        });
    });
  });
</script>

</body>
</html>
